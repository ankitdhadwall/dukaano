# Local development stack. Mirrors the production component list from blueprint §27 so that
# "works on my machine" and "works in staging" mean the same thing.
name: dukaano

services:
  postgres:
    # Pinned to the major version we run in production. Dukaano depends on Postgres-specific
    # features that are not portable: RLS policies (§13), pg_trgm search (§15.3), generated
    # columns, and pg_current_xact_id()/xid8 for the sync cursor (§14.5).
    image: postgres:16-alpine
    container_name: dukaano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukaano
      POSTGRES_PASSWORD: dukaano_dev_only
      POSTGRES_DB: dukaano
      # Deterministic collation so ORDER BY on Devanagari product names is stable across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      # 5433, not 5432 — a Homebrew Postgres is commonly already bound to 5432 on a dev Mac.
      - '5433:5432'
    volumes:
      - dukaano-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dukaano -d dukaano']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dukaano-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - dukaano-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dukaano-pgdata:
  dukaano-redisdata:
