name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The migration/owner role. Used only by `prisma migrate deploy`.
  DATABASE_ADMIN_URL_TEST: postgresql://dukaano:ci_password@localhost:5432/dukaano_test?schema=public
  # The application role. NOT the owner and without BYPASSRLS — PrismaService asserts this at
  # boot, so a CI misconfiguration that would weaken tenant isolation fails the build here rather
  # than reaching staging.
  DATABASE_URL_TEST: postgresql://dukaano_app:ci_password@localhost:5432/dukaano_test?schema=public

jobs:
  packages:
    name: Packages (lint · typecheck · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm --filter "./packages/**" lint
      - run: pnpm --filter "./packages/**" typecheck

      # @dukaano/money and @dukaano/business-logic carry HARD 100% coverage gates (blueprint
      # §26.1). Every rupee and every gram flows through them, they are pure and I/O-free, and a
      # bug there is both the most likely to be silent and the most costly to a shopkeeper.
      - name: Unit tests with coverage gates
        run: pnpm --filter "./packages/**" test:coverage

  mobile:
    name: Mobile (offline engine against real SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite ships with Node 22. The offline engine's tests run against it — the same
          # SQLite the phone uses, reached through a different binding — so the SQL, the CHECK
          # constraints and the transaction semantics under test are the ones that ship.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm --filter @dukaano/mobile lint
      - run: pnpm --filter @dukaano/mobile typecheck
      - run: pnpm --filter @dukaano/mobile test

  api:
    name: API (integration against real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the production major. Dukaano depends on Postgres-specific features that are
        # not portable: RLS (§13), pg_trgm search (§15.3), generated columns, and
        # pg_current_xact_id()/xid8 for the sync cursor (§14.5). Testing against anything else
        # would prove nothing.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dukaano
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dukaano_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dukaano"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_ADMIN_URL_TEST }}

      - name: Apply migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_ADMIN_URL_TEST }}

      - name: Lint and typecheck
        working-directory: apps/api
        run: |
          pnpm exec eslint src test
          pnpm exec tsc -p tsconfig.json --noEmit

      # These three suites are the Phase 1 acceptance criteria:
      #   tenant-isolation  — two shops cannot see each other, generated from the route table
      #   authorization     — the RBAC matrix is enforced per route, for all three roles
      #   auth-tokens       — refresh rotation, reuse detection, phone normalization
      - name: Integration tests
        working-directory: apps/api
        run: pnpm exec vitest run

      - run: pnpm --filter @dukaano/api build

  migrations:
    name: Migrations are reversible and complete
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dukaano
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dukaano_migration_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dukaano"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build

      # Catches the classic mistake of editing schema.prisma without generating a migration —
      # which works locally against an already-migrated database and fails on a fresh deploy.
      - name: Migrations apply cleanly from an empty database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dukaano:ci_password@localhost:5432/dukaano_migration_check?schema=public

      - name: No pending or failed migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate status
        env:
          DATABASE_URL: postgresql://dukaano:ci_password@localhost:5432/dukaano_migration_check?schema=public

      # `prisma migrate diff --exit-code` used to be here and could never pass. It asserts that the
      # Prisma datamodel fully describes the database, which is false BY DESIGN in this project:
      # RLS policies, generated columns, partial and trigram indexes, SECURITY DEFINER functions
      # and the change_log.txid default are all things Prisma cannot model, so the diff always
      # reported them as drift. A check that can only ever fail teaches people to ignore CI.
      #
      # The replacement guards the opposite and more dangerous direction: those raw-SQL objects are
      # invisible to Prisma, so nothing would notice if a migration edit silently dropped one.
      # The SQL lives in a committed file rather than inline — a heredoc inside a YAML block scalar
      # needs an unindented terminator, which YAML fights, and it is testable locally as a file.
      - name: Objects Prisma cannot see still exist, and RLS guards writes
        working-directory: apps/api
        env:
          PGPASSWORD: ci_password
        run: >-
          psql -h localhost -U dukaano -d dukaano_migration_check
          -v ON_ERROR_STOP=1 -qtA -f prisma/checks/raw-sql-objects.sql
